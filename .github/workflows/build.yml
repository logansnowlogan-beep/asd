name: Build Vial Firmware

on:
  push:
    branches:
      - main
      - master
    paths:
      - "keyboards/handwired/my_keyboard/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Checkout User Repository
        uses: actions/checkout@v4
        with:
          path: user_repo

      - name: Checkout Vial-QMK Repository
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          submodules: recursive
          path: vial-qmk

      - name: Configure QMK
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/vial-qmk"
          qmk setup -H "$GITHUB_WORKSPACE/vial-qmk" -y || true

      - name: Check QMK
        run: |
          cd vial-qmk
          qmk doctor || true

      - name: Inject Custom Keyboard
        run: |
          set -e
          rm -rf vial-qmk/keyboards/handwired/my_keyboard
          mkdir -p vial-qmk/keyboards/handwired
          cp -R user_repo/keyboards/handwired/my_keyboard vial-qmk/keyboards/handwired/my_keyboard

      - name: Validate JSON Files
        run: |
          set -e
          python3 -m json.tool vial-qmk/keyboards/handwired/my_keyboard/keyboard.json > /dev/null
          python3 -m json.tool vial-qmk/keyboards/handwired/my_keyboard/keymaps/vial/vial.json > /dev/null

      - name: Build Firmware
        run: |
          set -e
          cd vial-qmk
          qmk compile -kb handwired/my_keyboard -km vial

      - name: Upload Compiled Firmware
        uses: actions/upload-artifact@v4
        with:
          name: my_keyboard-vial-firmware
          path: |
            vial-qmk/.build/*.uf2
            vial-qmk/.build/*.bin
            vial-qmk/.build/*.hex
          if-no-files-found: error
