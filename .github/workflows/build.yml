name: Build Vial Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      # Step 1: Check out your personal repository containing your custom handwired layout
      - name: Checkout User Repository
        uses: actions/checkout@v4
        with:
          path: user_repo

      # Step 2: Check out the official Vial-QMK firmware codebase
      - name: Checkout Vial-QMK Repository
        uses: actions/checkout@v4
        with:
          repository: 'vial-kb/vial-qmk'
          ref: 'vial' 
          submodules: recursive
          path: vial-qmk

      # Step 3: Inject your custom handwired folder structure into the Vial environment
      - name: Setup and Inject Custom Keymap
        run: |
          git config --global --add safe.directory $(pwd)/vial-qmk
          
          # Target your handwired subfolder and recursively copy it into vial-qmk/keyboards/
          if [ -d "user_repo/keyboards/handwired" ]; then
            cp -R user_repo/keyboards/handwired vial-qmk/keyboards/
            echo "Successfully injected handwired directory into vial-qmk!"
          else
            echo "Error: user_repo/keyboards/handwired folder not found. Double check your repository structure."
            exit 1
          fi

      # Step 4: Compile using the precise relative path within the QMK directory structure
      - name: Compile Firmware
        run: |
          cd vial-qmk
          qmk compile -kb handwired/my_keyboard -km vial

      # Step 5: Export the compiled firmware binary out as a downloadable build artifact
      - name: Upload Compiled Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-vial-firmware
          path: |
            vial-qmk/.build/*.hex
            vial-qmk/.build/*.bin
            vial-qmk/.build/*.uf2
          if-no-files-found: warn
